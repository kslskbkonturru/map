<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Service Transformation Map — Build 004.01</title>

    <link rel="stylesheet" href="assets/css/reset.css">
    <link rel="stylesheet" href="assets/css/variables.css">
    <link rel="stylesheet" href="assets/css/layout.css">
    <link rel="stylesheet" href="assets/css/components.css">
    <link rel="stylesheet" href="assets/css/modal.css">
    <link rel="stylesheet" href="assets/css/timeline.css">
</head>

<body>
<div id="app">

    <header id="app-header">
        <div>
            <h1>Service Transformation Map</h1>
            <p id="program-title">Загрузка...</p>
        </div>

        <div>
            <span>Прогресс</span>
            <progress id="program-progress" value="0" max="100"></progress>
            <strong id="program-progress-value">0%</strong>
        </div>
    </header>

    <section id="goal-panel">
        <h2>Цель программы</h2>
        <p id="program-goal"></p>
    </section>

    <main id="workspace">

        <aside id="focus-panel">
            <h2>Фокусы</h2>
            <div id="focus-list"></div>
        </aside>

        <section id="map-panel">
            <div id="map-toolbar">
                <button data-view="roadmap">Дорожная карта</button>
                <button data-view="dependencies">Зависимости</button>
                <button data-view="owners">По владельцам</button>

                <span class="toolbar-spacer"></span>

                <button id="add-project-button" type="button">+ Добавить проект</button>
                <button id="remove-project-button" type="button" disabled>− Убрать проект</button>
            </div>

            <div id="map-container">
                <svg id="connection-layer"></svg>
                <div id="project-layer"></div>
            </div>
        </section>

        <aside id="attention-panel">
            <h2>Требует внимания</h2>
            <div id="risk-list"></div>
        </aside>

    </main>

    <section id="timeline-panel">
        <h2>Timeline</h2>
        <div id="timeline">
            <div id="timeline-controls"></div>
            <div id="timeline-scale"></div>
            <div id="timeline-header"></div>
            <div id="timeline-body"></div>
        </div>
    </section>

    <footer id="status-bar">
        <span id="status-text">Готово</span>
    </footer>

</div>

<div id="modal-overlay" hidden>
    <div id="project-modal">
        <button id="modal-close">✕</button>
        <h2 id="modal-title"></h2>
        <div id="modal-content"></div>
    </div>
</div>

<!-- Все JavaScript-файлы находятся в assets/js/ -->
<script src="assets/js/loader.js"></script>
<script src="assets/js/renderer.js"></script>
<script src="assets/js/layout.js"></script>
<script src="assets/js/svg.js"></script>
<script src="assets/js/timeline.js"></script>
<script src="assets/js/filters.js"></script>
<script src="assets/js/modal.js"></script>
<script src="assets/js/app.js"></script>

</body>
</html>
